[server]
port_rpc_admin_local
port_rpc_public

[port_rpc_admin_local]
port = 5006
ip = 127.0.0.1
admin = 127.0.0.1
protocol = http

[port_rpc_public]
port = 5005
ip = 0.0.0.0
protocol = http

[node_db]
type = NuDB
path = /var/lib/xrpld/nudb
fast_load = 1
earliest_seq = 1

[database_path]
/var/lib/xrpld/db

[debug_logfile]
/var/log/xrpld/debug.log

[ledger_history]
256

[rpc_startup]
{ "command": "log_level", "severity": "warning" }
