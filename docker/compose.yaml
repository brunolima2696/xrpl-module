name: xrpl-local

# Validated Release build: 7fba8940eee73da5039351c23486641953948dd9
x-xrpld-image: &xrpld-image ghcr.io/brunolima2696/xrpld@sha256:687a7c9fc389673fa996790d246c6aea5a314cbb4a390c13f96c54e44214ec3e

services:
  xrpld:
    image: *xrpld-image
    container_name: xrpld-local
    ports:
      - "127.0.0.1:5005:5005"
    volumes:
      - xrpld-data:/var/lib/xrpld
      - xrpld-logs:/var/log/xrpld
      - ./xrpld.cfg:/etc/xrpld/xrpld.cfg:ro
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/xrpld
        - server_info
        - --conf=/etc/xrpld/xrpld.cfg
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  ledger-closer:
    image: *xrpld-image
    container_name: xrpld-ledger-closer
    depends_on:
      xrpld:
        condition: service_healthy
    network_mode: "service:xrpld"
    volumes:
      - ./xrpld.cfg:/etc/xrpld/xrpld.cfg:ro
    entrypoint:
      - /bin/bash
      - -lc
    command:
      - |
        while true; do
          /usr/local/bin/xrpld ledger_accept \
            --conf=/etc/xrpld/xrpld.cfg >/dev/null || true
          sleep 1
        done
    restart: unless-stopped

volumes:
  xrpld-data:
  xrpld-logs:
